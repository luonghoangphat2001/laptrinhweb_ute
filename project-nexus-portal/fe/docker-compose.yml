services:
  # ReactJS Frontend Container with Nginx
  frontend_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: nexus_frontend_app
    restart: on-failure
    env_file:
      - .env
    ports:
      - "${PORT}:80"
