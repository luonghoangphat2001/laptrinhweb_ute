server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}

spring:
  application:
    name: nexus-portal-backend
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    show-sql: ${SHOW_SQL}
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ${SQL_INIT_MODE}
      continue-on-error: true
      data-locations:
        - classpath:data.sql
        - classpath:data/01_roles.sql
        - classpath:data/02_users.sql
        - classpath:data/03_products.sql

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  api:
    prefix: ${API_PREFIX}
    version: ${API_VERSION}
    base-url: ${API_BASE_URL}

springdoc:
  api-docs:
    path: ${SWAGGER_DOCS_PATH}
    enabled: true
  swagger-ui:
    path: ${SWAGGER_UI_PATH}
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

